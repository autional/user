name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：package.json 的 packageManager(pnpm@11.0.8) 是唯一真源。
      # 两处都写会触发 action 报错「Multiple versions of pnpm specified」。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Portal literals（门户清单单一真源）
        run: pnpm --filter @autional/end-user-portal exec autional-check-portal-literals --root .

      # 生产构建需要部署环境变量（API_ORIGIN / VITE_GRAFANA_URL 等，缺一个就 fail-closed），
      # 那是发布链路的职责；这里只做类型检查，避免在 CI 里伪造部署环境。
      - name: Typecheck
        run: pnpm typecheck

      # 无障碍闸门（AC C-28 / ui-denominator G5·G6）：jsx-a11y recommended，0 error/warn 才算过。
      # 单列一步的原因同 admin-console 试点：存量 lint 噪音大，a11y 需要独立亮红/亮绿。
      - name: A11y lint
        run: pnpm --filter @autional/end-user-portal run lint:a11y

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @autional/end-user-portal exec playwright install --with-deps chromium

      # 纯 API 控制台：用例内用 page.route 打桩，不需要后端
      - name: E2E smoke
        run: pnpm --filter @autional/end-user-portal test:e2e
